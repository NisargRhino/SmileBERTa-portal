services:
  # ── Flask API backend ────────────────────────────────────────────────────
  - type: web
    name: smileberta-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Optional: Postgres connection string (Neon, Supabase, Render Postgres…).
      # Without it accounts are stored in SQLite and reset on every redeploy.
      - key: DATABASE_URL
        sync: false
      - key: MODEL_CACHE_SIZE
        value: "1"
      # Usernames with admin ("master") rights, comma separated
      - key: ADMIN_USERNAMES
        value: nisarg.shah@emory.edu
      # Bert, the research agent. Without a key Bert still works, but only for
      # visitors who supply their own; the free allowance needs this set.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BERT_FREE_TURNS
        value: "20"

  # ── Docking API (AutoDock Vina, no PyTorch → fits in 512 MB) ───────────
  - type: web
    name: smileberta-dock
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.dock
    healthCheckPath: /health
    envVars:
      - key: VINA_CPU
        value: "1"

  # ── Static frontend ──────────────────────────────────────────────────────
  - type: static_site
    name: smileberta-web
    rootDir: ./frontend
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
