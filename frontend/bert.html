<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bert — your drug discovery agent | SmileBERTa</title>
  <meta name="description" content="Bert runs SmileBERTa's tools for you: dock compounds, predict fragments, profile ADMET and find the papers behind a result — from one plain-language request.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .bert-wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 40px; }

    .bert-hero { text-align: center; padding: 34px 0 18px; }
    .bert-hero .mark { width: 60px; height: 60px; margin: 0 auto 14px; display: grid; place-items: center;
      border-radius: 18px; background: var(--grad-soft); border: 1px solid var(--border-strong); }
    .bert-hero .mark svg { width: 34px; height: 34px; }
    .bert-hero h1 { font-size: 2.1rem; margin: 0 0 8px; }
    .built-on { display: inline-block; font-size: .78rem; letter-spacing: .08em;
      text-transform: uppercase; font-family: var(--display); font-weight: 600;
      color: var(--muted); border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 13px; margin: 0 0 14px; }
    .bert-hero p { color: var(--muted); max-width: 620px; margin: 0 auto; }

    .chat { border: 1px solid var(--border); border-radius: 16px; background: var(--panel);
      display: flex; flex-direction: column; min-height: 440px; overflow: hidden; }
    .chat-log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 62vh; }
    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg .av { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
      font-family: var(--display); font-weight: 700; font-size: .78rem; }
    .msg.user .av { background: var(--border-strong); color: #fff; }
    .msg.bert .av { background: var(--grad); color: #04121c; }
    .msg .body { flex: 1; min-width: 0; line-height: 1.6; }
    .msg .body > :first-child { margin-top: 0; }
    .msg .body > :last-child { margin-bottom: 0; }
    .msg .body p { margin: 0 0 9px; }
    .msg .body ul, .msg .body ol { margin: 0 0 9px; padding-left: 20px; }
    .msg .body li { margin-bottom: 4px; }
    .msg .body code { font-family: var(--mono); font-size: .86em; background: var(--bg);
      border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; word-break: break-all; }
    .msg .body table { width: 100%; border-collapse: collapse; margin: 4px 0 12px; font-size: .9rem; }
    .msg .body th { text-align: left; font-family: var(--display); font-size: .74rem; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border-strong); padding: 0 10px 6px 0; }
    .msg .body td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .msg .body h3 { font-size: 1rem; margin: 14px 0 6px; }
    .msg .body a { color: var(--accent); }

    .tool { border: 1px solid var(--border); border-radius: 11px; background: var(--bg); overflow: hidden; margin: 0 0 9px; }
    .tool summary { cursor: pointer; padding: 9px 12px; display: flex; align-items: center; gap: 9px;
      font-size: .88rem; list-style: none; }
    .tool summary::-webkit-details-marker { display: none; }
    .tool .ico { width: 20px; height: 20px; flex: none; color: var(--accent); }
    .tool .ico svg { width: 100%; height: 100%; }
    .tool .tname { font-family: var(--display); font-weight: 600; color: #fff; }
    .tool .targ { color: var(--muted); font-family: var(--mono); font-size: .78rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .tool .tstate { font-size: .74rem; color: var(--muted); flex: none; }
    .tool.running .tstate { color: var(--accent); }
    .tool.failed { border-color: rgba(248,113,113,.4); }
    .tool.failed .tstate { color: #f87171; }
    .tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--border); background: #05080f;
      font-family: var(--mono); font-size: .76rem; color: var(--faint); overflow-x: auto; max-height: 260px; }
    .tool .headline { padding: 2px 12px 10px; font-size: .86rem; color: var(--text); }
    .tool .headline b { color: #fff; }

    .chat-foot { border-top: 1px solid var(--border); padding: 12px; background: var(--bg); }
    .composer { display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px;
      border-radius: 11px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
      font: inherit; font-size: .95rem; line-height: 1.45; }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer button { flex: none; }
    .chat-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-top: 9px; font-size: .78rem; color: var(--faint); flex-wrap: wrap; }
    .chat-meta a { color: var(--muted); text-decoration: underline; }

    .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 6px 0 2px; }
    .starter { text-align: left; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer; font: inherit; font-size: .88rem; line-height: 1.45;
      transition: border-color .15s, transform .15s; }
    .starter:hover { border-color: var(--accent); transform: translateY(-1px); }
    .starter b { display: block; font-family: var(--display); color: #fff; margin-bottom: 3px; font-size: .9rem; }

    .typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      margin-right: 3px; animation: blink 1.3s infinite; }
    .typing span:nth-child(2) { animation-delay: .18s; } .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .notice { border-radius: 11px; padding: 11px 14px; font-size: .86rem; margin-bottom: 12px; }
    .notice.warn { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); color: #fde68a; }
    .notice.err { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); color: #fca5a5; }
    .key-row { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
    .key-row input { flex: 1; min-width: 220px; padding: 9px 12px; border-radius: 9px;
      border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-family: var(--mono); font-size: .82rem; }
  </style>
  <script src="assets/js/core.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/rdkit/2024.3.5/RDKit_minimal.js" defer></script>
  <script src="assets/js/bert.js" defer></script>
</head>
<body>
<main class="bert-wrap">
  <div class="bert-hero">
    <div class="mark" id="bert-mark"></div>
    <h1>Say hello to Bert</h1>
    <div class="built-on">Built on Claude · runs SmileBERTa's own tools</div>
    <p>Ask for the work in plain language. Bert plans it, runs SmileBERTa's tools — docking,
       fragment prediction, ADMET, classification, literature — reads the numbers, and reports back.</p>
  </div>

  <div id="bert-notice"></div>

  <div class="chat">
    <div class="chat-log" id="log"></div>
    <div class="chat-foot">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="e.g. Dock aspirin and ibuprofen into COX-2 (5IKR), then fragment whichever binds better" autocomplete="off"></textarea>
        <button class="btn primary" id="send" type="submit">Send</button>
      </form>
      <div class="chat-meta">
        <span id="quota"></span>
        <span><a href="./terms">Research use only</a> · predictions, not measurements</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
