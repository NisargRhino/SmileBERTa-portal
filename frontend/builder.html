<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molecule Builder — SmileBERTa</title>
  <meta name="description" content="Build molecules atom by atom in 3D and optimise their geometry with the MMFF94 and UFF force fields.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    #energy-chart { width: 100%; height: 110px; display: block; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid var(--border); }
    .conf-item { cursor: pointer; padding: 8px 10px; }
    .first-atom { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; pointer-events: none; }
    .first-atom > div { pointer-events: auto; text-align: center; }
    .first-atom .btn-xl { width: 92px; height: 92px; border-radius: 50%; font: 700 2rem var(--display); }
    .hint-line { font-size: .78rem; color: var(--text-2); }
  </style>
  <script src="assets/js/core.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.5.2/3Dmol-min.js" defer></script>
  <script src="assets/js/builder.js" defer></script>
</head>
<body data-bg="none">
  <div id="site-nav"></div>
  <main class="app-shell">
    <!-- LEFT: build tools -->
    <aside class="app-side">
      <section>
        <div class="panel-title">Tools</div>
        <div class="toolbtn-grid" id="tools"></div>
        <p class="hint-line" id="tool-hint" style="margin:12px 0 0"></p>
      </section>
      <section>
        <div class="row-between"><div class="panel-title">Element</div><span class="kbd-hint">keys <kbd>C</kbd> <kbd>N</kbd> <kbd>O</kbd>…</span></div>
        <div class="el-grid" id="elements"></div>
      </section>
      <section>
        <div class="row-between"><div class="panel-title">Bond order</div><span class="kbd-hint"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></div>
        <div class="seg seg-block" id="bond-order"><button class="active" data-o="1">Single</button><button data-o="2">Double</button><button data-o="3">Triple</button></div>
      </section>
      <section>
        <div class="panel-title">Start from SMILES</div>
        <div class="input-group"><input class="input input-sm mono" id="smiles-in" placeholder="c1ccccc1O" spellcheck="false"><button class="btn btn-sm" id="smiles-load">Load</button></div>
        <div class="panel-title" style="margin-top:14px">Templates</div>
        <div class="row" style="gap:5px" id="templates"></div>
      </section>
    </aside>

    <!-- CENTER: viewport -->
    <div class="app-main">
      <div class="app-topbar">
        <button class="btn btn-sm btn-ghost btn-icon" id="undo" title="Undo (⌘Z)"></button>
        <button class="btn btn-sm btn-ghost btn-icon" id="redo" title="Redo (⇧⌘Z)"></button>
        <button class="btn btn-sm btn-ghost" id="clear">Clear</button>
        <span class="sep"></span>
        <div class="seg" id="style-seg"><button class="active" data-s="ballstick">Ball &amp; stick</button><button data-s="stick">Sticks</button><button data-s="sphere">Spacefill</button><button data-s="line">Wire</button></div>
        <label class="check" style="margin-left:6px"><input type="checkbox" id="show-h" checked> H</label>
        <label class="check"><input type="checkbox" id="show-labels"> Labels</label>
        <span class="sep"></span>
        <button class="btn btn-sm btn-ghost" id="import">Import</button>
        <div class="nav-drop" data-drop id="export-drop" style="position:relative"><button class="btn btn-sm btn-ghost" type="button">Export ▾</button>
          <div class="nav-menu" style="min-width:180px;left:auto;right:0">
            <a href="#" data-exp="sdf"><span><span class="mi-title">SDF / MOL</span></span></a><a href="#" data-exp="xyz"><span><span class="mi-title">XYZ</span></span></a>
            <a href="#" data-exp="pdb"><span><span class="mi-title">PDB</span></span></a><a href="#" data-exp="smiles"><span><span class="mi-title">Copy SMILES</span></span></a>
            <a href="#" data-exp="png"><span><span class="mi-title">Image (PNG)</span></span></a></div></div>
        <div style="margin-left:auto" class="row">
          <button class="btn btn-sm" id="save"></button>
          <button class="btn btn-sm btn-primary" id="to-dock"></button>
        </div>
      </div>
      <div class="app-stage">
        <div class="viewer-host" id="viewer"></div>
        <div class="first-atom hidden" id="first-atom"><div><button class="btn btn-primary btn-xl" id="place-first">C</button><p class="muted" style="margin-top:14px">Click to place the first atom,<br>or load a SMILES / template on the left.</p></div></div>
        <div class="hud tl"><div class="hud-card" id="hud-tool"></div></div>
        <div class="hud bl"><div class="hud-card mono" id="hud-info" style="font-size:.74rem"></div></div>
        <div class="hud br"><div class="hud-card mono hidden" id="hud-energy" style="font-size:.74rem"></div></div>
      </div>
    </div>

    <!-- RIGHT: force field & properties -->
    <aside class="app-side right">
      <section>
        <div class="panel-title">Force field</div>
        <div class="two-col" style="gap:8px">
          <select class="select input-sm" id="ff"><option value="MMFF94">MMFF94</option><option value="MMFF94s">MMFF94s</option><option value="UFF">UFF</option></select>
          <select class="select input-sm" id="steps"><option value="500">500 steps</option><option value="2000" selected>2000 steps</option><option value="5000">5000 steps</option></select>
        </div>
        <button class="btn btn-primary btn-block" id="optimize" style="margin-top:10px"></button>
        <div class="row-between" style="margin-top:10px">
          <label class="check"><input type="checkbox" id="auto-clean" checked> Auto-clean after edits</label>
          <button class="btn btn-xs" id="quick-clean" title="Fast in-browser geometry clean-up">Clean</button>
        </div>
        <canvas id="energy-chart" style="margin-top:12px"></canvas>
        <div class="kv" id="energy-kv" style="margin-top:8px"></div>
      </section>
      <section>
        <div class="panel-title">Conformer search</div>
        <div class="input-group"><select class="select input-sm" id="n-conf"><option>5</option><option selected>10</option><option>20</option></select><button class="btn btn-sm" id="conf-run" style="flex-shrink:0">Search (ETKDG)</button></div>
        <div class="stack" id="conf-list" style="margin-top:10px"></div>
      </section>
      <section>
        <div class="row-between"><div class="panel-title" style="margin:0">Molecule</div><button class="btn btn-xs" id="analyze">Full analysis</button></div>
        <div class="kv" id="props" style="margin-top:8px"></div>
        <div id="analysis" style="margin-top:12px"></div>
      </section>
    </aside>
  </main>
</body>
</html>
